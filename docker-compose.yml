services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vibeprompt
      POSTGRES_PASSWORD: vibeprompt
      POSTGRES_DB: vibeprompt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibeprompt"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://vibeprompt:vibeprompt@db:5432/vibeprompt
      AUTO_CREATE_TABLES: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
